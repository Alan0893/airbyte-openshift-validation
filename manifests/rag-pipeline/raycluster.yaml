# RayCluster for the EDGAR RAG ingestion pipeline
#
# Requires: KubeRay operator installed via RHOAI or standalone
#
# Seed corpus is read from S3 (see edgar-seed-s3 Secret). Pipeline code and
# dependencies ship in the custom Ray image (pinned by digest below).
#
# Private Quay: create a docker-registry Secret named quay-pull before apply.
# Public Quay: remove imagePullSecrets from the pod templates.
#
# Validation sizing (2 workers × 2 CPU = 4 worker CPUs):
#   Docling: 2 actors × 1 CPU = 2 CPUs
#   Embed:   1 actor  × 2 CPU = 2 CPUs
#   Milvus:  1 actor  × 1 CPU = 1 CPU
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: edgar-rag
  labels:
    app.kubernetes.io/part-of: edgar-rag-pipeline
    app.kubernetes.io/component: compute
spec:
  rayVersion: "2.54.0"
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "0"
    template:
      metadata:
        labels:
          app: edgar-rag-head
      spec:
        imagePullSecrets:
          - name: quay-pull
        securityContext:
          runAsNonRoot: true
        containers:
          - name: ray-head
            image: quay.io/rh-ee-alalin/edgar-rag-ray@sha256:2e5e4886bf80f0a267714233c94c88116230e51b0f7de4d002c345dfce0e92bf
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "1"
                memory: 2Gi
            env:
              - name: RAY_GRAFANA_IFRAME_HOST
                value: ""
              - name: INPUT_SOURCE
                value: s3
              - name: PYTHONPATH
                value: /opt/edgar-rag
            envFrom:
              - secretRef:
                  name: edgar-seed-s3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
  workerGroupSpecs:
    - groupName: workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 4
      rayStartParams:
        num-cpus: "2"
      template:
        metadata:
          labels:
            app: edgar-rag-worker
        spec:
          imagePullSecrets:
            - name: quay-pull
          securityContext:
            runAsNonRoot: true
          containers:
            - name: ray-worker
              image: quay.io/rh-ee-alalin/edgar-rag-ray@sha256:2e5e4886bf80f0a267714233c94c88116230e51b0f7de4d002c345dfce0e92bf
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              env:
                - name: INPUT_SOURCE
                  value: s3
                - name: PYTHONPATH
                  value: /opt/edgar-rag
              envFrom:
                - secretRef:
                    name: edgar-seed-s3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
